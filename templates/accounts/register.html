{% extends "base.html" %}
{% load static %}
{% block title %}Register | ProManage{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4"><i class="bi bi-person-plus me-2"></i>Create Account</h3>

                    <form id="registerForm" data-submit-url="{% url 'register_submit' %}" novalidate>
                        {% csrf_token %}

                        <div id="alertBox"></div>

                        <div class="mb-3">
                            <label class="form-label">First Name *</label>
                            <input name="first_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name *</label>
                            <input name="last_name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Username *</label>
                            <input name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input name="email" type="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password *</label>
                            <input name="password" type="password" class="form-control" required>
                        </div>

                        <button id="submitBtn" type="submit" class="btn btn-primary w-100">
                            Register
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/accounts/register.js' %}"></script>
{% endblock %}
