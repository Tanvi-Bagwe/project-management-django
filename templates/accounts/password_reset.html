{% extends "base.html" %}
{% load static %}
{% block content %}

    <div class="card shadow-sm mx-auto max-width-400">
        <div class="card-body">
            <h5 class="mb-3">
                <i class="bi bi-envelope me-2"></i>Reset Password
            </h5>

            <p class="text-muted">
                Enter your email and we’ll send you a reset link.
            </p>

            <form method="post" id="resetForm" novalidate>
                {% csrf_token %}
                <div id="alertBox"></div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           required
                    >
                </div>

                <button class="btn btn-primary">Send Reset Link</button>
            </form>

        </div>
    </div>
    <script src="{% static 'js/password_request.js' %}"></script>
{% endblock %}
