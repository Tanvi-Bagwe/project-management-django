{% extends "base.html" %}
{% block content %}

    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="mb-3">
                <i class="bi bi-envelope me-2"></i>Reset Password
            </h5>

            <p class="text-muted">
                Enter your email and we’ll send you a reset link.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.email }}

                <button class="btn btn-primary w-100 mt-3">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

{% endblock %}
