{% extends "base.html" %}
{% load static %}
{% block title %}Login | ProManage{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h3>

                    <form id="loginForm"
                          data-submit-url="{% url 'login_submit' %}"
                          novalidate>
                        {% csrf_token %}

                        <div id="alertBox"></div>

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input name="username" class="form-control" required placeholder="Enter username only">

                            <small class="text-muted">
                                Login works only with username (not email)
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control"
                                   required>
                        </div>

                        <button id="submitBtn" type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                        <a href="{% url 'register' %}" type="button" class="btn btn-light w-100 mt-1">
                            <i class="bi bi-person-plus-fill me-2"></i>Register
                        </a>
                        <a href="{% url 'password_reset' %}">
                            <i class="bi bi-question-circle"></i> Forgot password?
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/accounts/login.js' %}"></script>
{% endblock %}
