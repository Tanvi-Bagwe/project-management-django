{% extends "base.html" %}
{% block content %}

    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="mb-3">
                <i class="bi bi-shield-lock me-2"></i>Set New Password
            </h5>

            <form method="post">
                {% csrf_token %}
                {{ form.new_password1 }}
                {{ form.new_password2 }}

                <button class="btn btn-success w-100 mt-3">
                    Update Password
                </button>
            </form>
        </div>
    </div>

{% endblock %}
