{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-4">
                    <i class="bi bi-shield-lock text-warning" style="font-size: 5rem;"></i>
                </div>
                <h1 class="display-4 fw-bold">403</h1>
                <h2 class="mb-3">Access Denied</h2>
                <p class="text-muted mb-4">
                    Sorry, you don't have the required permissions to view this page.
                    If you believe this is an error, please contact your Manager.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-2"></i>Go Back
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-2"></i>Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
