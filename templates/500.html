{% extends "base.html" %}

{% block title %}System Error{% endblock %}

{% block content %}
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-4">
                    <i class="bi bi-gear-wide-connected text-secondary" style="font-size: 5rem;"></i>
                </div>
                <h1 class="display-4 fw-bold">500</h1>
                <h2 class="mb-3">Something Went Wrong</h2>
                <p class="text-muted mb-4">
                    Our servers are having a bit of a moment. We've been notified of the issue and are looking into it.
                </p>
                <a href="{% url 'dashboard' %}" class="btn btn-dark px-4">
                    <i class="bi bi-arrow-clockwise me-2"></i>Try Refreshing
                </a>
            </div>
        </div>
    </div>
{% endblock %}
