{% extends "base.html" %}

{% block content %}
    <h4 class="mb-4">
        <i class="bi bi-shield-lock"></i> Admin Dashboard
    </h4>

    <div class="row g-3">
        {% for s in stats %}
            <div class="col-md-3">
                <div class="card text-bg-{{ s.color }} shadow-sm">
                    <div class="card-body">
                        <h6><i class="bi bi-{{ s.icon }}"></i> {{ s.label }}</h6>
                        <h3>{{ s.value }}</h3>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
