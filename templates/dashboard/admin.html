{% extends "base.html" %}
{% block content %}

    <h4><i class="bi bi-speedometer2 me-2"></i>All Projects</h4>

    <div class="row">
        {% for project in projects %}
            <div class="col-md-4">
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h6>{{ project.name }}</h6>
                        <p>Status: {{ project.status.name }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

{% endblock %}
