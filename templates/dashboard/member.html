{% extends "base.html" %}
{% block content %}

    <h4 class="mb-4">
        <i class="bi bi-list-check me-2"></i>My Tasks
    </h4>

    <div class="row">
        {% for task in tasks %}
            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card shadow-sm h-100 task-card cursor-pointer"
                     onclick="location.href='{% url 'task_detail' task.id %}'"
                >

                    <div class="card-body">
                        <h6 class="card-title">
                            <i class="bi bi-check2-square me-1"></i>{{ task.title }}
                        </h6>

                        <p class="text-muted small mb-2">
                            <i class="bi bi-folder me-1"></i>{{ task.project.name }}
                        </p>
                        {% if task.due_date %}
                            <small class="text-muted">
                                <i class="bi bi-calendar"></i>
                                {{ task.due_date }}
                            </small>
                        {% endif %}

                        <span class="badge
                          {% if task.status.code == 'todo' %}bg-secondary
                          {% elif task.status.code == 'in_progress' %}bg-warning text-dark
                          {% else %}bg-success{% endif %}">
                          {{ task.status.name }}
                        </span>
                    </div>

                </div>
            </div>
        {% empty %}
            <p>No tasks assigned.</p>
        {% endfor %}
    </div>

{% endblock %}
