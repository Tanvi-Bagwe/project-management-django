{% extends "base.html" %}
{% block content %}

    <h3>
        <i class="bi bi-list-task me-2"></i>{{ task.title }}
    </h3>

    <p>{{ task.description }}</p>

    <p>
        <strong>Assigned By:</strong> {{ task.assigned_by.username }}<br>
        <strong>Assigned On:</strong> {{ task.assigned_at }}
    </p>

    <select id="statusSelect" class="form-select w-25">
        {% for status in statuses %}
            <option value="{{ status.id }}"
                    {% if task.status_id == status.id %}selected{% endif %}>
                {{ status.name }}
            </option>
        {% endfor %}
    </select>

    <button class="btn btn-primary mt-3" onclick="updateStatus()">
        Update Status
    </button>

    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <i class="bi bi-check-circle text-success fs-3"></i>
                    <p class="mt-2">Task status updated</p>
                    <button class="btn btn-primary btn-sm" data-bs-dismiss="modal">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script>
        function updateStatus() {
            fetch("{% url 'task_status_update' task.id %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: new URLSearchParams({
                    status_id: document.getElementById("statusSelect").value
                })
            })
                .then(res => res.json())
                .then(() => {
                    new bootstrap.Modal(
                        document.getElementById("statusModal")
                    ).show();
                });
        }
    </script>

{% endblock %}
